name: Compactor image

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Dockerfile.compactor
      - .dockerignore
      - src/**
      - .github/workflows/compactor-image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC identity claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'))
            core.info(JSON.stringify({aud: claims.aud, sub: claims.sub, repository: claims.repository, ref: claims.ref}))
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::196920285698:role/coin-data-compactor-github
          aws-region: ap-southeast-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.compactor
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/coin-data-parquet-compactor:latest
            ${{ steps.login-ecr.outputs.registry }}/coin-data-parquet-compactor:${{ github.sha }}
