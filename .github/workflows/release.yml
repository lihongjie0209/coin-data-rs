name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins --locked
      - name: Package
        run: |
          tar -C target/release -czf coin-data-rs-${{ matrix.target }}.tar.gz coin-data-rs parquet-bench
      - uses: softprops/action-gh-release@v2
        with:
          files: coin-data-rs-${{ matrix.target }}.tar.gz
