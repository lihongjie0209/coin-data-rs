# Receive bursts from high-frequency market-data WebSockets without collapsing TCP buffers.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216
net.core.netdev_max_backlog = 4096

# Detect dead upstream connections sooner; application-level WebSocket heartbeats remain primary.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Preserve RAM for the collector while retaining swap as an emergency OOM safety net.
vm.swappiness = 10
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
